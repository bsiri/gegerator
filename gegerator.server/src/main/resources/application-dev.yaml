# Profile for development

spring:
  r2dbc:
    name: gegerator

  web:
    resources:
      # The new Angular builder now outputs client-side content
      # in a directory named "/browser" (see angular.json, and the dist
      # directory), then itself bundled by maven-frontend-plugin in "/static"
      # (unzip -l the gegerator.client jar to see where all the assets
      # land). Hence, we redefine the static assets location:
      static-locations: classpath:/static/browser/

  # TODO: this doesn't work unfortunately, I suppose this is again
  # because this is a spring-reactive application
  #datasource:
  #  data: data-test.sql

  #########################################
  # H2 console will not work out of the box either due to this app
  # being a spring-reactive app. However there is a workaround,
  # see class org.bsiri.gegerator.config.H2ConsoleConfiguration.
  # Basically:
  # 1. run the app with profile "dev" (eg with --spring.profiles.active=dev)
  # 2. access the console at: http://localhost:8082/
  # 3: db url is jdbc:h2:mem:gegerator, login/pwd = sa/<blank>
  # (remember that "gegerator" is technically the value of "spring.r2dbc.name" above)
  #
  # Anyway the h2 console snippet below will not work, left it there
  # as documentation.
  #h2:
  #  console:
  #    enabled: true
  ##########################################

  # Do not set base-path: it breaks requests to static assets (the client expects
  # them to be at the base path '/')
  # At the moment it's simpler to just configure each api controllers to serve at
  # basepath /api instead of setting it globally and configure exceptions for
  # static assets
  #webflux:
  #  base-path: /api


scoring:
  # Theater ratings have a normal scoring,
  # except for Never which is very very penalized.
  theaters:
    HIGHEST: 1000
    HIGH: 100
    DEFAULT: 10
    NEVER: -99999

  # Same scoring logic than for theaters.
  movies:
    HIGHEST: 1000
    HIGH: 100
    DEFAULT: 10
    NEVER: -99999

  # Events ratings have a tremendous value
  # compared to the rest
  events:
     MANDATORY: 999999
     DEFAULT: 0
     NEVER: -999999

