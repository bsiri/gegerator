
<h1 mat-dialog-title>Charger un état</h1>
<form mat-dialog-content #uploadDialog="ngForm">
    <div class="dialog-field">
        <input id="file" class="testid-uad-file" name="file" type="file" (change)="changeFile($event)"/>
    </div>    
</form>
<div mat-dialog-actions>
    <button mat-button class="testid-uad-ok" (click)="confirm()" [disabled]="file === null">OK</button>
    <button mat-button class="testid-uad-cancel" (click)="cancel()">Annuler</button>
</div>
